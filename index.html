<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Tablero</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#172b4d;background:linear-gradient(135deg,#0d2b3e,#1e5a5e) fixed;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#top{background:#000;color:#fff;display:flex;align-items:center;gap:12px;padding:0 12px;height:44px;flex:none}
#top b{font-size:16px}
#q{flex:1;max-width:560px;margin:0 auto;padding:6px 12px;border-radius:4px;border:1px solid #555;background:#1d2125;color:#fff}
.cr{background:#579dff;color:#082145;border:0;border-radius:4px;padding:6px 12px;font-weight:600}
#bar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:rgba(0,0,0,.3);color:#fff;flex-wrap:wrap;flex:none}
#sel{background:transparent;border:0;font-size:18px;font-weight:700;color:#fff;max-width:280px}
#sel option{color:#172b4d}
#bar .sp{flex:1}
.tb{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:4px;padding:5px 10px;transition:background .15s ease}
.tb:hover{background:rgba(255,255,255,.32)}
#board{flex:1;min-height:0;display:flex;gap:10px;align-items:stretch;overflow-x:auto;padding:12px}
.col{flex:none;width:272px;max-height:100%;display:flex;flex-direction:column;background:#f1f2f4;border-radius:12px;padding:6px 6px 4px}
.col.over{outline:2px dashed #579dff}
.col.min{width:48px;align-items:center;padding:8px 0;gap:8px}
.col.min h2{writing-mode:vertical-rl;margin:0;font-size:14px}
.ch{display:flex;align-items:center;gap:2px;padding:4px 2px 8px 8px}
.ch h2{flex:1;margin:0;font-size:14px;font-weight:600;padding:2px 4px;overflow-wrap:anywhere;text-transform:uppercase}
.n{color:#626f86;font-size:13px;margin-right:4px}
.x{border:0;background:none;color:#44546f;font-size:16px;line-height:1;padding:4px 6px;border-radius:4px}
.x:hover{background:rgba(9,30,66,.12)}
.cards{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px;min-height:0;flex:1}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 1px rgba(9,30,66,.25);cursor:pointer;overflow:hidden;flex:none;transition:box-shadow .15s ease,transform .15s ease}
.card:hover{outline:2px solid #579dff;box-shadow:0 2px 8px rgba(9,30,66,.2);transform:translateY(-1px)}
.card.dragging{opacity:.4}
.col.dragging{opacity:.5}
@media (pointer:coarse){.card,.col{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
.card .cv{display:block;width:100%;max-height:260px;object-fit:cover}
.cb{padding:8px 10px}
.lb{display:flex;gap:4px;margin-bottom:6px}
.lb i{width:40px;height:8px;border-radius:4px}
.ct{display:flex;gap:8px;align-items:flex-start}
.ct span{flex:1;overflow-wrap:anywhere}
.ok{flex:none;width:16px;height:16px;margin-top:2px;border:2px solid #8590a2;border-radius:50%;background:#fff;padding:0;color:#fff;font-size:10px;line-height:1}
.ok.on{background:#22a06b;border-color:#22a06b}
.bd{display:flex;gap:12px;color:#44546f;font-size:12px;margin-top:6px}
.add{width:100%;margin-top:6px;padding:8px 10px;border:0;border-radius:8px;background:transparent}
.add:hover{background:rgba(9,30,66,.1)}
.add:focus{background:#fff;box-shadow:inset 0 0 0 2px #579dff;outline:0}
.add::placeholder{color:#44546f}
.addcol{flex:none;width:272px;padding:10px 12px;border:0;border-radius:12px;background:rgba(255,255,255,.28);color:#fff}
.addcol::placeholder{color:#fff}
.addcol:focus{background:#fff;color:#172b4d;outline:0}
#menu{position:fixed;background:#fff;border-radius:8px;box-shadow:0 8px 16px rgba(9,30,66,.4);padding:4px;display:none;z-index:9}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 14px;border-radius:4px}
#menu button:hover{background:#f1f2f4}
#toast{top:auto;right:auto;margin:0;border:0;overflow:visible;position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#172b4d;color:#fff;padding:10px 16px;border-radius:8px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:99;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}
#toast:not([hidden]){pointer-events:auto}
#warn{position:fixed;top:44px;left:0;right:0;z-index:98;background:#c9372c;color:#fff;padding:8px 12px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
#warn button{background:#fff;color:#172b4d;border:0;border-radius:4px;padding:4px 10px;font-weight:600}
#toast button{background:#579dff;color:#082145;border:0;border-radius:4px;padding:4px 10px;font-weight:600;cursor:pointer;transition:background .15s ease}
#toast button:hover{background:#7bb0ff}
[contenteditable="true"]{outline:2px solid #579dff;background:#fff;text-transform:none}
:focus-visible{outline:2px solid #579dff;outline-offset:1px}
[hidden]{display:none!important}
#home{flex:1;overflow-y:auto;background:#fff}
.hw{max-width:960px;margin:0 auto;padding:32px 20px}
.hw h2{margin:0 0 14px;font-size:14px;color:#44546f;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{position:relative;background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(9,30,66,.3);overflow:hidden;transition:box-shadow .15s ease,transform .15s ease}
.open{display:block;width:100%;border:0;background:none;padding:0;text-align:left}
.th{height:72px}
.tn{padding:8px 10px;font-size:13px;color:#44546f;text-transform:uppercase}
.tile:hover{box-shadow:0 0 0 2px #579dff;transform:translateY(-2px)}
.star{position:absolute;top:8px;right:8px;border:0;border-radius:4px;background:rgba(0,0,0,.28);color:#fff;padding:1px 6px;opacity:0}
.tile:hover .star,.star.on,.star:focus-visible{opacity:1}
.star.on{color:#ffd54a}
.tile.new{background:#f1f2f4;border:0;min-height:105px;color:#44546f}
dialog{width:min(640px,94vw);max-height:92vh;padding:0;border:0;border-radius:12px;background:#fff;color:#172b4d}
dialog::backdrop{background:rgba(0,0,0,.6)}
.mcv{display:block;width:100%;max-height:220px;object-fit:cover}
.mb{padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px}
.mt{font-size:20px;font-weight:700;border:0;padding:4px 6px;margin:0 -6px;border-radius:4px;width:100%}
.mt:focus,.mb textarea:focus,.cit:focus,.cadd:focus{outline:2px solid #579dff}
.ml{margin:0;color:#626f86;font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lab{width:44px;height:28px;border:0;border-radius:4px;color:#fff;font-weight:700}
.mb label,.mb h3{font-weight:600;font-size:13px;margin:0;display:flex;flex-direction:column;gap:4px}
.mb textarea{border:1px solid #c7d1db;border-radius:6px;padding:8px;resize:vertical}
.ci{display:flex;gap:8px;align-items:center}
.cit,.cadd{flex:1;border:1px solid transparent;border-radius:4px;padding:5px 8px}
.cadd{border-color:#c7d1db}
.btn{border:0;background:#091e420f;border-radius:4px;padding:6px 12px;transition:background .15s ease}
.btn:hover{background:#091e4224}
.btn.del{color:#ae2e24}
@media(max-width:600px){
  #top{flex-wrap:wrap;height:auto;padding:6px 8px;gap:6px}
  #top b{font-size:14px}
  #q{max-width:100%;order:3;flex-basis:100%}
  #bar{flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px;gap:6px}
  #bar .sp{display:none}
  #sel{max-width:100%;flex:1;min-width:120px}
  .tb{flex:1;min-width:60px;text-align:center;padding:6px 4px;font-size:12px}
  #board{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px}
  .col{width:272px;max-height:100%}
  .col.min{width:100%;flex-direction:row;padding:8px}
  .col.min h2{writing-mode:horizontal-tb}
  .addcol{width:100%}
  .hw{padding:16px 12px}
  .grid{grid-template-columns:1fr}
  .tile{min-height:80px}
  #toast{left:10px;right:10px;transform:none;bottom:10px;width:auto}
  #toast button{margin-left:auto}
}
</style>
</head>
<body>
<header id="top"><b>Tablero</b><button class="tb" id="hb">Tableros</button><input id="q" type="search" placeholder="Buscar" aria-label="Buscar"><button class="cr" id="nb">Crear</button></header>
<div id="bar">
  <select id="sel" aria-label="Cambiar de tablero"></select>
  <button class="tb" id="rb">Renombrar</button>
  <button class="tb" id="db">Eliminar</button>
  <span class="sp"></span>
  <button class="tb" id="bgb">Fondo</button>
  <button class="tb" id="bgx" hidden>Quitar fondo</button>
  <button class="tb" id="eb">Exportar</button>
  <button class="tb" id="ib">Importar</button>
  <input type="file" id="file" accept="application/json" hidden>
  <input type="file" id="bgf" accept="image/*" hidden>
</div>
<section id="home" hidden></section>
<main id="board"></main>
<div id="menu"><button data-a="ren">Renombrar</button><button data-a="clr">Vaciar columna</button><button data-a="fix">Fijar columna</button><button data-a="del">Eliminar columna</button></div>
<div id="warn" role="alert" hidden><span>⚠ No se puede guardar (almacenamiento lleno). Haz una copia con Exportar y reduce las imágenes.</span><button id="warnx">Exportar ahora</button></div>
<div id="toast" popover="manual" hidden></div>
<dialog id="dlg" aria-label="Tarjeta"></dialog>
<dialog id="askDlg" aria-label="Entrada de texto">
  <div class="mb">
    <h3 id="askTitle" style="margin:0;font-size:16px"></h3>
    <input class="mt" id="askInput" style="border:1px solid #c7d1db;border-radius:6px" maxlength="60">
    <div class="row" style="margin-top:12px">
      <span style="flex:1"></span>
      <button class="btn" id="askCancel">Cancelar</button>
      <button class="cr" id="askOk">Aceptar</button>
    </div>
  </div>
</dialog>
<dialog id="pickDlg" aria-label="Seleccionar">
  <div class="mb">
    <h3 id="pickTitle" style="margin:0;font-size:16px"></h3>
    <div id="pickList" style="display:flex;flex-direction:column;gap:6px;margin-top:12px"></div>
    <div class="row" style="margin-top:12px">
      <span style="flex:1"></span>
      <button class="btn" id="pickCancel">Cancelar</button>
    </div>
  </div>
</dialog>
<script>
const K='tablero-v1',VER=1,$=id=>document.getElementById(id);
const uid=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>(b%36).toString(36)).join('');
const esc=s=>(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const LC={r:['#f87168','Rojo'],o:['#fca700','Naranja'],y:['#e2b203','Amarillo'],g:['#4bce97','Verde'],b:['#579dff','Azul'],p:['#9f8fef','Morado']};
function seed(){const id=uid();return{cur:id,boards:[{id,name:'Mi tablero',cols:[
  {id:uid(),t:'Por hacer',cards:[{id:uid(),t:'Haz clic en esta tarjeta para abrirla',l:['b','g']}]},
  {id:uid(),t:'En curso',cards:[]},{id:uid(),t:'Hecho',cards:[]}]}]}}
/* Normalización: valida y sanea el estado (localStorage e importaciones) */
const isL=x=>Object.prototype.hasOwnProperty.call(LC,x);
const sid=v=>String(v==null?'':v).replace(/[^\w-]/g,'').slice(0,32);
const sImg=(v,ref)=>typeof v==='string'&&(/^data:image\/(?:jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(v)||(ref&&/^idb:[a-z0-9]{6,32}$/.test(v)))?v:'';
const str=(v,n)=>typeof v==='string'?v.slice(0,n):'';
const mk=(raw,fresh,seen)=>{let i=fresh?'':sid(raw);if(!i||seen.has(i))i=uid();seen.add(i);return i};
function normCard(k,fresh,seen){
  k=k&&typeof k==='object'?k:{};
  const o={id:mk(k.id,fresh,seen),t:str(k.t,1000)||'Sin título'};
  if(typeof k.d==='string'&&k.d)o.d=k.d.slice(0,50000);
  const l=Array.isArray(k.l)?[...new Set(k.l.filter(isL))]:[];if(l.length)o.l=l;
  if(Array.isArray(k.ck)&&k.ck.length)o.ck=k.ck.map(x=>{const r={t:str(x&&x.t,1000),x:!!(x&&x.x)};if(x&&Array.isArray(x.items)&&x.items.length)r.items=x.items.map(y=>({t:str(y&&y.t,1000),x:!!(y&&y.x)}));return r});
  const cv=sImg(k.cv,!fresh);if(cv)o.cv=cv;
  if(k.done)o.done=true;if(k.pinned)o.pinned=true;
  return o}
function normCol(c,fresh,seen){
  c=c&&typeof c==='object'?c:{};
  const o={id:mk(c.id,fresh,seen),t:str(c.t,200)||'Columna',cards:(Array.isArray(c.cards)?c.cards:[]).map(k=>normCard(k,fresh,seen))};
  if(c.min)o.min=true;if(c.fixed)o.fixed=true;
  return o}
function normBoard(b,fresh,seen){
  b=b&&typeof b==='object'?b:{};
  const o={id:mk(b.id,fresh,seen),name:str(b.name,200)||'Tablero',cols:(Array.isArray(b.cols)?b.cols:[]).map(c=>normCol(c,fresh,seen))};
  if(b.fav)o.fav=true;const bg=sImg(b.bg,!fresh);if(bg)o.bg=bg;
  return o}
function normState(d){
  const seen=new Set(),bs=d&&Array.isArray(d.boards)?d.boards.map(b=>normBoard(b,false,seen)):[];
  if(!bs.length)return seed();
  const cur=sid(d.cur);
  return{cur:bs.some(b=>b.id===cur)?cur:bs[0].id,boards:bs,version:VER}}
let S,recovered=false;
const rescue=raw=>{recovered=true;try{localStorage.setItem(K+'-corrupto',raw)}catch(e){}};
(()=>{let raw=null;
  try{raw=localStorage.getItem(K)}catch(e){}
  if(raw===null){S=seed();return}
  try{const d=JSON.parse(raw);
    if(!d||!Array.isArray(d.boards)||!d.boards.length)throw 0;
    S=normState(d)}
  catch(e){rescue(raw);S=seed()}
})();
S.version=VER;

let saveT=null,pending=false,quiet=false;
const persist=()=>{pending=false;try{localStorage.setItem(K,JSON.stringify(S));$('warn').hidden=true}catch(e){$('warn').hidden=false}};
const save=()=>{pending=true;clearTimeout(saveT);saveT=setTimeout(persist,300)};
const flush=()=>{clearTimeout(saveT);if(pending)persist()};
addEventListener('storage',async e=>{
  if(e.storageArea!==localStorage||e.key!==K||e.newValue===null)return;
  try{
    const prev=S.cur,n=normState(JSON.parse(e.newValue));await loadImgs(n);
    clearTimeout(saveT);pending=false;
    if(dlg.open){cc=null;ck=null;dirty=false;dlg.close()}
    S=n;S.version=VER;if(S.boards.some(b=>b.id===prev))S.cur=prev;
    quiet=true;renderNow();quiet=false;
    toast('Otra pestaña ha modificado los datos; esta vista se ha actualizado.');
  }catch(x){}
});
addEventListener('visibilitychange',()=>{if(document.hidden)flush()});addEventListener('pagehide',flush);
$('hb').onclick=()=>{home=true;render()};
const B=()=>S.boards.find(b=>b.id===S.cur)||S.boards[0];
const colOf=id=>B().cols.find(c=>c.id===id);
const loc=id=>{for(const c of B().cols){const i=c.cards.findIndex(k=>k.id===id);if(i>=0)return{c,i}}};
const board=$('board'),sel=$('sel'),dlg=$('dlg'),menu=$('menu');
let toastT=null;
let hideT=null;
function toast(msg,fn){const t=$('toast');clearTimeout(toastT);clearTimeout(hideT);
  t.textContent='';const sp=document.createElement('span');sp.textContent=msg;t.appendChild(sp);
  if(fn){const u=document.createElement('button');u.id='undo';u.textContent='Deshacer';u.onclick=()=>{fn();hideToast()};t.appendChild(u)}
  t.hidden=false;try{if(t.showPopover){if(t.matches(':popover-open'))t.hidePopover();t.showPopover()}}catch(x){}
  requestAnimationFrame(()=>{t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)'});toastT=setTimeout(hideToast,5000)}
function hideToast(){const t=$('toast');t.style.opacity='0';t.style.transform='translateX(-50%) translateY(20px)';clearTimeout(hideT);hideT=setTimeout(()=>{t.hidden=true;try{if(t.hidePopover&&t.matches(':popover-open'))t.hidePopover()}catch(x){}},200)}
const img=(f,m)=>new Promise((r,j)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?r(b):j(new Error('No se pudo codificar la imagen')),'image/jpeg',.72)};i.onerror=()=>{URL.revokeObjectURL(u);j(new Error('No se pudo cargar la imagen'))};i.src=u});

/* Imágenes en IndexedDB: el estado guarda solo referencias 'idb:<id>'. Si IndexedDB falla se usan data URLs como antes */
let idb=null;const IMGB=new Map(),IMGU=new Map();
const isRef=v=>typeof v==='string'&&v.startsWith('idb:');
const src=v=>!v?'':isRef(v)?(IMGU.get(v)||''):v;
const imgTag=(c,v)=>{const u=src(v);return u?`<img class="${c}" src="${u}" alt="">`:''};
const idbOpen=()=>new Promise((ok,no)=>{try{const r=indexedDB.open('tablero-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);r.onblocked=()=>no(new Error('bloqueada'))}catch(e){no(e)}});
const reqP=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const txDone=t=>new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=t.onabort=()=>no(t.error)});
const blobToDataURL=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(b)});
function dataToBlob(u){const m=/^data:(image\/(?:jpeg|png|webp|gif));base64,(.*)$/.exec(u);if(!m)return null;const bin=atob(m[2]),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m[1]})}
function cacheBlob(ref,blob){IMGB.set(ref,blob);if(!IMGU.has(ref))IMGU.set(ref,URL.createObjectURL(blob))}
function imgRefs(st){const o=[];for(const b of st.boards){if(b.bg)o.push(b.bg);for(const c of b.cols)for(const k of c.cards)if(k.cv)o.push(k.cv)}return o}
async function storeBlob(blob){
  if(idb){try{const ref='idb:'+uid(),t=idb.transaction('img','readwrite');t.objectStore('img').put({b:blob,t:Date.now()},ref);await txDone(t);cacheBlob(ref,blob);return ref}catch(e){}}
  return blobToDataURL(blob)}
const storeImage=async(f,m)=>storeBlob(await img(f,m));
async function loadImgs(st){
  if(!idb)return;
  const need=[...new Set(imgRefs(st).filter(r=>isRef(r)&&!IMGU.has(r)))];if(!need.length)return;
  try{const t=idb.transaction('img','readonly'),os=t.objectStore('img');
    const got=await Promise.all(need.map(r=>reqP(os.get(r)).then(v=>[r,v&&v.b])));
    got.forEach(([r,b])=>{if(b)cacheBlob(r,b)})}catch(e){}}
async function externalize(boards){
  if(!idb)return 0;let n=0;
  const mv=async(o,key)=>{const v=o[key];if(typeof v!=='string'||!v.startsWith('data:'))return;const bl=dataToBlob(v);if(!bl)return;const r=await storeBlob(bl);if(isRef(r)){o[key]=r;n++}};
  for(const b of boards){await mv(b,'bg');for(const c of b.cols)for(const k of c.cards)await mv(k,'cv')}
  return n}
async function gcImgs(){
  if(!idb)return;
  try{const used=new Set(imgRefs(S).filter(isRef)),cut=Date.now()-864e5,t=idb.transaction('img','readwrite');
    t.objectStore('img').openCursor().onsuccess=e=>{const c=e.target.result;if(!c)return;if(!used.has(c.key)&&c.value&&c.value.t<cut)c.delete();c.continue()};
    await txDone(t)}catch(e){}}
const initP=(async()=>{
  try{idb=await idbOpen()}catch(e){idb=null}
  if(!idb)return;
  try{
    const n=await externalize(S.boards);
    await loadImgs(S);
    if(n){clearTimeout(saveT);persist()}
    gcImgs()}catch(e){}
})();

function cardHTML(k){
  const ck=k.ck||[],all=ck.flatMap(x=>x.items&&x.items.length?x.items:[x]),dn=all.filter(x=>x.x).length;
  return `<div class="card" tabindex="0" draggable="true" data-k="${k.id}">${imgTag('cv',k.cv)}<div class="cb">
  ${k.l&&k.l.length?`<div class="lb">${k.l.map(x=>`<i style="background:${LC[x][0]}"></i>`).join('')}</div>`:''}

let raf=null;

    <input class="add" data-add="${c.id}" placeholder="+ Añade una tarjeta" maxlength="300" aria-label="Añadir tarjeta"></section>`).join('')
   +'<input class="addcol" id="addcol" placeholder="+ Añade otra columna" maxlength="60" aria-label="Añadir columna">';

function dropCardAt(kid,col,y){
  const at=loc(kid);if(!at)return;
  const [k]=at.c.cards.splice(at.i,1),dest=colOf(col.dataset.c);
  const els=[...col.querySelectorAll('.card:not(.dragging)')];

  if(idx<0)idx=els.length;
  const shown=dest.cards.slice().sort((a,b)=>(b.pinned||false)-(a.pinned||false)),ref=dest.min?null:shown[idx];
  dest.cards.splice(ref?dest.cards.indexOf(ref):dest.cards.length,0,k);render()}
function dropColAt(fromId,col){
  const from=B().cols.findIndex(c=>c.id===fromId),to=B().cols.findIndex(c=>c.id===col.dataset.c);
  if(from<0||to<0||from===to)return;
  const [m]=B().cols.splice(from,1);B().cols.splice(to,0,m);render()}
board.addEventListener('drop',e=>{

/* Arrastre táctil: pulsación larga (350 ms) sobre una tarjeta o columna; un gesto rápido sigue desplazando */
const TP={t:null,el:null,kind:null,id:null,x0:0,y0:0,x:0,y:0,ox:0,oy:0,on:false,ghost:null,over:null,raf:0};
function tpReset(){
  clearTimeout(TP.t);cancelAnimationFrame(TP.raf);
  if(TP.ghost)TP.ghost.remove();
  if(TP.el){TP.el.classList.remove('dragging');TP.el.draggable=true}
  document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'));
  Object.assign(TP,{t:null,el:null,kind:null,id:null,on:false,ghost:null,over:null})}
function tpStart(){
  if(!TP.el)return;TP.on=true;
  const r=TP.el.getBoundingClientRect();TP.ox=TP.x-r.left;TP.oy=TP.y-r.top;
  const g=TP.el.cloneNode(true);['data-k','data-c','draggable'].forEach(a=>g.removeAttribute(a));g.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  g.style.cssText=`position:fixed;left:0;top:0;width:${r.width}px;max-height:${Math.min(r.height,320)}px;overflow:hidden;z-index:200;pointer-events:none;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.35);transform:translate(${r.left}px,${r.top}px) rotate(3deg)`;
  document.body.appendChild(g);TP.ghost=g;TP.el.classList.add('dragging');
  if(navigator.vibrate)navigator.vibrate(15);
  tpLoop()}
function tpLoop(){
  if(!TP.on)return;
  TP.ghost.style.transform=`translate(${TP.x-TP.ox}px,${TP.y-TP.oy}px) rotate(3deg)`;
  if(TP.x<48)board.scrollLeft-=14;else if(TP.x>innerWidth-48)board.scrollLeft+=14;
  const col=(document.elementFromPoint(TP.x,TP.y)||document.body).closest('.col');
  if(TP.kind==='card'&&col){const w=col.querySelector('.cards');if(w){const r=w.getBoundingClientRect();if(TP.y<r.top+40)w.scrollTop-=10;else if(TP.y>r.bottom-40)w.scrollTop+=10}}
  document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));
  if(col&&!(TP.kind==='col'&&col.dataset.c===TP.id))col.classList.add('over');
  TP.over=col;TP.raf=requestAnimationFrame(tpLoop)}
board.addEventListener('touchstart',e=>{
  tpReset();
  if(e.touches.length!==1||board.querySelector('[data-board]'))return;
  const col=e.target.closest('.col');if(!col||e.target.closest('input,button,[contenteditable="true"]'))return;
  const card=e.target.closest('.card'),t=e.touches[0];
  TP.kind=card?'card':'col';TP.el=card||col;TP.id=card?card.dataset.k:col.dataset.c;
  TP.x0=TP.x=t.clientX;TP.y0=TP.y=t.clientY;
  TP.el.draggable=false;TP.t=setTimeout(tpStart,350)},{passive:true});
board.addEventListener('touchmove',e=>{
  if(!TP.el)return;const t=e.touches[0];TP.x=t.clientX;TP.y=t.clientY;
  if(!TP.on){if(Math.hypot(TP.x-TP.x0,TP.y-TP.y0)>10)tpReset();return}
  e.preventDefault()},{passive:false});
board.addEventListener('touchend',e=>{
  if(!TP.el)return;
  if(!TP.on){tpReset();return}
  e.preventDefault();
  const col=TP.over,kind=TP.kind,id=TP.id,y=TP.y;tpReset();
  if(col&&kind==='card')dropCardAt(id,col,y);else if(col&&kind==='col')dropColAt(id,col)});
board.addEventListener('touchcancel',tpReset);
board.addEventListener('contextmenu',e=>{if(TP.el)e.preventDefault()});

/* Ventana de tarjeta */
let cc=null,ck=null;
function openCard(id){const r=loc(id);if(!r)return;cc=r.c;ck=r.c.cards[r.i];ck.l=ck.l||[];ck.ck=ck.ck||[];dirty=false;draw();if(!dlg.open)dlg.showModal()}
function draw(){

  <label>Descripción<textarea id="md" rows="4" placeholder="Añade una descripción más detallada…">${esc(ck.d)}</textarea></label>
  <div><h3>Lista de tareas</h3>${ck.ck.map((x,i)=>`<div class="ci"><input type="checkbox" data-ci="${i}" ${x.x?'checked':''} aria-label="Hecha"><input class="cit" data-ct="${i}" value="${esc(x.t)}" aria-label="Tarea"><button class="x" data-cd="${i}" aria-label="Eliminar tarea">×</button></div>${(x.items||[]).map((y,j)=>`<div class="ci" style="margin-left:28px"><input type="checkbox" data-ii="${i}:${j}" ${y.x?'checked':''} aria-label="Hecha"><input class="cit" data-it="${i}:${j}" value="${esc(y.t)}" aria-label="Subtarea"><button class="x" data-cs="${i}:${j}" aria-label="Eliminar subtarea">×</button></div>`).join('')}`).join('')}
  <div class="ci" style="margin-top:6px"><input class="cadd" id="cadd" placeholder="Añadir un elemento" aria-label="Añadir tarea"></div></div>
  <div class="row"><button class="btn" id="cvb">${ck.cv?'Cambiar portada':'Añadir portada'}</button>${ck.cv?'<button class="btn" id="cvx">Quitar portada</button>':''}<input type="file" id="cvf" accept="image/*" hidden>
  <button class="btn" id="cpin">${ck.pinned?'Desfijar':'Fijar'}</button><button class="btn" id="cdup">Duplicar</button><button class="btn" id="cmove">Mover a…</button><span style="flex:1"></span><button class="btn del" id="cdel">Eliminar tarjeta</button><button class="btn" id="cclose">Cerrar</button></div></div>`}
let dlgDown=null;dlg.addEventListener('mousedown',e=>{dlgDown=e.target});
dlg.addEventListener('click',async e=>{
  const t=e.target;
  if(t.dataset.l){const l=ck.l,i=l.indexOf(t.dataset.l);i<0?l.push(t.dataset.l):l.splice(i,1);dirty=true;draw()}
  else if(t.dataset.cd!==undefined){ck.ck.splice(+t.dataset.cd,1);dirty=true;draw()}
  else if(t.dataset.cs!==undefined){const [i,j]=t.dataset.cs.split(':').map(Number);ck.ck[i].items.splice(j,1);dirty=true;draw()}
  else if(t.id==='cvb')$('cvf').click();
  else if(t.id==='cvx'){delete ck.cv;dirty=true;draw()}
  else if(t.id==='cpin'){ck.pinned=!ck.pinned;dirty=true;draw();save()}
  else if(t.id==='cdup'){const copy={...ck,id:uid(),t:ck.t+' (copia)',l:[...(ck.l||[])],ck:ck.ck?ck.ck.map(x=>({...x,...(x.items?{items:x.items.map(y=>({...y}))}:{})})):[]};cc.cards.splice(cc.cards.indexOf(ck)+1,0,copy);draw();save()}
  else if(t.id==='cmove'){pick('¿A qué tablero mover?',S.boards.map(b=>b===B()?b.name+' (actual)':b.name),bi=>{const destBoard=S.boards[bi];if(!destBoard)return;if(!destBoard.cols.length)return toast('Ese tablero no tiene columnas.');pick('¿A qué columna?',destBoard.cols.map(c=>c.t),ci=>{const destCol=destBoard.cols[ci];if(!destCol||!cc||!ck)return;cc.cards.splice(cc.cards.indexOf(ck),1);destCol.cards.push(ck);dirty=false;cc=null;ck=null;dlg.close();render();flush();toast('Tarjeta movida a '+destBoard.name+' › '+destCol.t)})})}
  else if(t.id==='cdel'){const c0=cc,k0=ck,i=c0.cards.indexOf(k0);c0.cards.splice(i,1);cc=null;ck=null;dlg.close();render();save();toast('Tarjeta eliminada',()=>{if(S.boards.some(b=>b.cols.includes(c0))){c0.cards.splice(Math.min(i,c0.cards.length),0,k0);render();save()}})}
  else if(t.id==='cclose'||(t===dlg&&dlgDown===dlg))dlg.close();
  save();
});
dlg.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='mt')ck.t=t.value;else if(t.id==='md')ck.d=t.value;else if(t.dataset.ct!==undefined)ck.ck[+t.dataset.ct].t=t.value;
  else if(t.dataset.it!==undefined){const [i,j]=t.dataset.it.split(':').map(Number);ck.ck[i].items[j].t=t.value}

dlg.addEventListener('change',async e=>{

  else if(t.dataset.ii!==undefined){const [i,j]=t.dataset.ii.split(':').map(Number);ck.ck[i].items[j].x=t.checked;dirty=true;save()}

dlg.addEventListener('keydown',e=>{

$('db').onclick=()=>{if(S.boards.length<2)return toast('Necesitas al menos un tablero.');const bd=B(),i=S.boards.indexOf(bd);S.boards.splice(i,1);S.cur=S.boards[0].id;home=true;render();toast('Tablero eliminado',()=>{if(!S.boards.includes(bd)){S.boards.splice(Math.min(i,S.boards.length),0,bd);S.cur=bd.id;home=false;render()}})};
$('bgb').onclick=()=>$('bgf').click();
$('bgf').onchange=async e=>{const f=e.target.files[0];if(f){if(f.size>10*1024*1024){toast('La imagen es demasiado grande (máx. 10 MB).')}else{try{B().bg=await storeImage(f,1600);render()}catch(x){toast('No se pudo procesar la imagen.')}}}e.target.value=''};
$('bgx').onclick=()=>{delete B().bg;render()};
$('eb').onclick=async()=>{
  const out=JSON.parse(JSON.stringify(S));
  const fix=async(o,key)=>{const v=o[key];if(!isRef(v))return;const bl=IMGB.get(v);if(bl){try{o[key]=await blobToDataURL(bl);return}catch(e){}}delete o[key]};
  for(const b of out.boards){await fix(b,'bg');for(const c of b.cols)for(const k of c.cards)await fix(k,'cv')}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='tablero-copia.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('ib').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{
    if(f.size>20*1024*1024)throw 0;
    const d=JSON.parse(await f.text());
    if(!d||!Array.isArray(d.boards)||!d.boards.length)throw 0;
    const seen=new Set(),names=new Set(S.boards.map(b=>b.name));
    const add=d.boards.map(b=>{const nb=normBoard(b,true,seen),base=nb.name;let n=2;while(names.has(nb.name))nb.name=base+' ('+n+++')';names.add(nb.name);return nb});
    await externalize(add);const prev=S.cur;S.boards=S.boards.concat(add);S.cur=add[0].id;home=false;render();flush();
    toast('Importados '+add.length+' tablero'+(add.length!==1?'s':''),()=>{const ids=new Set(add.map(b=>b.id));S.boards=S.boards.filter(b=>!ids.has(b.id));S.cur=S.boards.some(b=>b.id===prev)?prev:S.boards[0].id;home=true;render();save()})
  }catch(x){toast('El archivo no es una copia válida.')}
  e.target.value=''};
$('home').addEventListener('click',e=>{
  const o=e.target.closest('[data-b]'),s=e.target.closest('[data-s]');
  if(s){const b=S.boards.find(x=>x.id===s.dataset.s);b.fav=!b.fav;render()}
  else if(o){S.cur=o.dataset.b;home=false;render()}
  else if(e.target.closest('#newt'))newBoard();
  else if(e.target.closest('#importBtn'))$('file').click();
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,[contenteditable]')||e.ctrlKey||e.metaKey||e.altKey||document.querySelector('dialog[open]'))return;
  if(e.key==='/'&&!home){e.preventDefault();$('q').focus()}
  else if(e.key==='n'&&!home){e.preventDefault();board.querySelector('[data-add]')?.focus()}
});
$('warnx').onclick=()=>$('eb').click();
Promise.race([initP,new Promise(r=>setTimeout(r,800))]).then(()=>{render();if(recovered)toast('Los datos guardados estaban dañados. Se conserva una copia en tablero-v1-corrupto.')});
initP.then(()=>render());
</script>
</body>
</html>
